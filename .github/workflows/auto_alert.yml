name: Daily WhatsApp Alert

on:
  schedule:
    - cron: '30 1 * * *'  # 7:00 AM IST (03:30 UTC)
  workflow_dispatch:  # allows manual trigger too

jobs:
  send_alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Timerio WhatsApp Alert
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          PHONE_NUMBER_ID: ${{ secrets.PHONE_NUMBER_ID }}
          RECIPIENT_PHONE: ${{ secrets.RECIPIENT_PHONE }}
        run: python timerio_alert.py
